  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://newsgrid-production-16cb.up.railway.app" crossorigin />

      "@context": "https://schema.org",

      "alternateName": "NewsGrid",
      "url": "https://news-grid-pi.vercel.app",
      "description": "پلتفرم تجمیع و کلسترینگ هوشمند اخبار فارسی"
    }
