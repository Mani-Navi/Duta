# ── 1. Extract True Client IP Behind ParsPack CDN (Prevents Global 429 Rate-Limit Lockout) ──
map $http_x_forwarded_for $client_real_ip {
    default $remote_addr;
    "~^(?P<firstAddr>[0-9a-fA-F:.]+),?.*$" $firstAddr;
}

# ── 2. Smart Search & AI Crawler Detection (SEO + GEO) ──
map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|google-extended|googleother|bingbot|msnbot|yandex|duckduckbot|slurp|baiduspider|telegrambot|twitterbot|whatsapp|facebookexternalhit|meta-externalagent|linkedinbot|discordbot|slackbot|applebot|applebot-extended|gptbot|oai-searchbot|chatgpt-user|perplexitybot|claudebot|claude-web|anthropic-ai|cohere-ai) 1;
}

# ── 3. Persistent HTTP/1.1 Keepalive Upstreams (Eliminates TCP Socket Exhaustion) ──
upstream duta_backend {
    server nitt-backend:8080;
    keepalive 64;
}

upstream duta_prerender {
    server duta-prerender:4000;
    keepalive 16;
}

# ── 4. Redirect HTTP (Port 80) to Canonical https://duta.ir ──
server {
    listen 80;
    server_name duta.ir www.duta.ir 109.122.250.5;
    server_tokens off;
    return 301 https://duta.ir$request_uri;
}

# ── 5. Redirect HTTPS www & Raw IP to Canonical https://duta.ir ──
server {
    listen 443 ssl http2;
    server_name www.duta.ir 109.122.250.5;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://duta.ir$request_uri;
}

# ── 6. Main Production HTTPS Server (Canonical: duta.ir) ──
server {
    listen 443 ssl http2;
    server_name duta.ir;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Zero-Copy Kernel I/O & Open File Descriptor Cache in RAM
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # SSL Certificates & TLS Session Resumption
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # High-Speed Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Global OWASP Security Headers (Grade A)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://duta.ir https://www.google-analytics.com https://analytics.google.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self';" always;

    # Shared In-Memory Proxy Buffer Settings (Prevents Disk Temp-File Writes)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;

    # Native robots.txt
    location = /robots.txt {
        default_type text/plain;
        access_log off;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/articles/fetch-now\nDisallow: /api/articles/reclassify\n\nUser-agent: Googlebot\nAllow: /\n\nUser-agent: GPTBot\nAllow: /\n\nUser-agent: OAI-SearchBot\nAllow: /\n\nUser-agent: PerplexityBot\nAllow: /\n\nUser-agent: ClaudeBot\nAllow: /\n\nSitemap: https://duta.ir/sitemap.xml\n";
    }

    # Native /llms.txt for AI Search Engines (GEO)
    location = /llms.txt {
        default_type text/plain;
        access_log off;
        return 200 "# Duta (دوتا) — دو نگاه، یک حقیقت\n> Duta (https://duta.ir) is an automated Persian news aggregation, multi-source clustering, and credibility verification platform.\n\n## Core Purpose & Methodology\n- **Multi-Source Clustering:** Groups related Persian news articles published within a 6-hour window using Jaccard Similarity (>= 25% token overlap).\n- **Bayesian Credibility Scoring (0-100%):** Evaluates every news story based on weighted source credibility (Credibility^2) plus an independent multi-source verification boost.\n- **Credibility Tiers:**\n  - **Verified (تأیید شده - Green):** Score >= 80%.\n  - **Developing / Under Review (در حال بررسی - Orange):** Score 50% to 79%.\n  - **Unverified (نامعتبر - Red):** Score < 50%.\n\n## Key Links & Feeds\n- Homepage: https://duta.ir/\n- Credibility Methodology: https://duta.ir/credibility\n- Platform Features: https://duta.ir/features\n- Privacy Policy: https://duta.ir/privacy\n- Terms & Editorial Disclaimer: https://duta.ir/terms\n- About & Contact: https://duta.ir/about (info@duta.ir)\n- Google News & Web Sitemap: https://duta.ir/sitemap.xml\n- Live News JSON API: https://duta.ir/api/articles?page=0&size=20\n- Breaking News JSON API: https://duta.ir/api/articles/breaking?page=0&size=20\n- Live USD & 18K Gold Price API: https://duta.ir/api/prices\n";
    }

    # Google News XML Sitemap via Keepalive Upstream
    location = /sitemap.xml {
        proxy_pass http://duta_backend/api/articles/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Immutable 1-Year Cache for Vite Hashed Assets
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Bot & AI Crawler Routing for /article/*
    location /article/ {
        error_page 418 = @prerender;
        if ($is_bot = 1) {
            return 418;
        }
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location @prerender {
        proxy_pass http://duta_prerender;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        proxy_intercept_errors on;
        error_page 404 500 502 503 504 =200 /index.html;
    }

    # Proxy /api/ requests to Backend via Keepalive Pool
    
    location ^~ /cards/ {
        proxy_pass http://duta-bot:3005/cards/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /api/ {
        proxy_pass http://duta_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA Client Routing (Enables Chrome bfcache & Preserves Global Security Headers)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
