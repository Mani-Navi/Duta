# ===================================================================
# Application Core Configurations
# ===================================================================
spring.application.name=nitt-backend

# ===================================================================
# Database & Datasource Settings (with ENV Fallbacks)
# ===================================================================
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/nitt_db}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HikariCP Connection Pool (5 Connections to match 5 Async Workers)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# Encoding & Network HTTP Compression
# ===================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===================================================================
# Actuator & Monitoring Settings
# ===================================================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Logging Configurations
# ===================================================================
logging.level.root=WARN
logging.level.com.NewsGrid=INFO
logging.level.com.Nitt=INFO

# Security Token
jwt.secret=${JWT_SECRET:default_dev_secret_key_change_in_production_1234567890!}

# ===================================================================
# Optional Outbound Proxy Configurations (Disabled by Default)
# ===================================================================
proxy.enabled=${PROXY_ENABLED:false}
proxy.host=${PROXY_HOST:127.0.0.1}
proxy.port=${PROXY_PORT:1080}
proxy.type=${PROXY_TYPE:HTTP}