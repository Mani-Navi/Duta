# ===================================================================
# Application Core Configurations
# ===================================================================
spring.application.name=nitt-backend
server.port=${PORT:8080}

# ===================================================================
# Database & Datasource Settings (Smart ENV Fallbacks)
# ===================================================================
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nitt_db}}
spring.datasource.username=${POSTGRES_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HikariCP Connection Pool
# ===================================================================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / Hibernate Configurations (Zero N+1 & Batching Enabled)
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ===================================================================
# Java 21 Virtual Threads (Project Loom)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# Encoding & Network HTTP Compression
# ===================================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===================================================================
# Actuator & Monitoring Settings
# ===================================================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when_authorized

# ===================================================================
# Security & Optional Proxy (Injected via Environment Variables)
# ===================================================================
jwt.secret=${JWT_SECRET:}
proxy.enabled=${PROXY_ENABLED:false}
proxy.host=${PROXY_HOST:127.0.0.1}
proxy.port=${PROXY_PORT:1080}
proxy.type=${PROXY_TYPE:HTTP}

# ===================================================================
# Structured Logging & Rolling Policy
# ===================================================================
logging.level.root=WARN
logging.level.com.NewsGrid.V10=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.file.name=logs/duta-prod.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n