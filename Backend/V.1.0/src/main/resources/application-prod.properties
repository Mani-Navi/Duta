# ===================================================================
# Production Profile Environment Overrides
# ===================================================================

# Database (Smart Fallback: Reads POSTGRES_URL first, then PGHOST/PGPORT, then localhost)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nitt_db}}
spring.datasource.username=${POSTGRES_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}

# Hikari Connection Pool Override for Production
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=1

# JPA Performance
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator Security Override
management.endpoint.health.show-details=when_authorized

# لاگ‌های سیستمی روی سرور فقط در سطح خطا یا اخطار
logging.level.root=WARN
logging.level.com.NewsGrid.V10=INFO

# Security
jwt.secret=${JWT_SECRET}

# مسیر ذخیره‌سازی در داخل کانتینر (باید به یک Volume در داکر وصل باشد)
logging.file.name=logs/duta-prod.log

# سیاست چرخش فایل (برای جلوگیری از پر شدن هارد سرور)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14

# فرمت تمیز برای لاگ‌های خط فرمان
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n

# فقط خطاهای واقعی دیتابیس و اسپرینگ چاپ شود
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
