# ===================================================================
# Production Profile Environment Overrides
# ===================================================================

# Database (Smart Fallback: Reads POSTGRES_URL first, then PGHOST/PGPORT, then localhost)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nitt_db}}
spring.datasource.username=${POSTGRES_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}

# Hikari Connection Pool Override for Production
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA Performance
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator Security Override
management.endpoint.health.show-details=when_authorized

# Strict Logging
logging.level.root=WARN
logging.level.com.NewsGrid=INFO
logging.level.com.Nitt=INFO

# Security
jwt.secret=${JWT_SECRET}